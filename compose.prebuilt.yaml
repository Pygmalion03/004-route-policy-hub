services:
  route-policy-hub:
    image: ghcr.io/pygmalion03/004-route-policy-hub:latest
    container_name: route-policy-hub
    # Q4 bind-mounted project folders are not writable by the image's UID 1001.
    # The remaining restrictions keep the container's root filesystem read-only.
    user: "0:0"
    restart: unless-stopped
    init: true
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    ports:
      - "8787:3000"
    environment:
      ADMIN_PASSWORD: "${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}"
      DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
    tmpfs:
      - /tmp
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/policies').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
